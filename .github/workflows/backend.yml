name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wsip
          POSTGRES_PASSWORD: wsip_dev
          POSTGRES_DB: wsip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wsip:wsip_dev@localhost:5432/wsip_test
      TEST_DATABASE_URL: postgresql://wsip:wsip_dev@localhost:5432/wsip_test
      WSIP_TOKENS: >-
        {"admin-token":{"user_id":"00000000-0000-0000-0000-000000000001","username":"admin","roles":["admin","org_analytics"]},
         "manager-token":{"user_id":"00000000-0000-0000-0000-000000000002","username":"manager","roles":["manager"]},
         "analyst-token":{"user_id":"00000000-0000-0000-0000-000000000003","username":"analyst","roles":["org_analytics"]}}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff
        working-directory: .

      - name: Lint (ruff)
        run: ruff check backend/
        working-directory: .

      - name: Run tests
        run: pytest backend/tests/ --tb=short -q
        working-directory: .
