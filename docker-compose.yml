services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: wsip
      POSTGRES_USER: wsip
      POSTGRES_PASSWORD: wsip_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsip -d wsip"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://wsip:wsip_dev@db:5432/wsip
      WSIP_TOKENS: >-
        {"admin-token":{"user_id":"00000000-0000-0000-0000-000000000001","username":"admin","roles":["admin","org_analytics"]},
         "manager-token":{"user_id":"00000000-0000-0000-0000-000000000002","username":"manager","roles":["manager"]},
         "analyst-token":{"user_id":"00000000-0000-0000-0000-000000000003","username":"analyst","roles":["org_analytics"]},
         "hrbp-token":{"user_id":"00000000-0000-0000-0000-000000000004","username":"hrbp","roles":["hrbp"]}}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
